server.port=8080
spring.application.name=standalone-app

# Database Configuration
# Default: File-based H2 Database for a zero-setup standalone execution
spring.datasource.url=jdbc:h2:file:./ticket_booking_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Alternatively, uncomment to run with MySQL:
# spring.datasource.url=jdbc:mysql://localhost:3306/ticket_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

